name: ci

# PDK-free and headless: no ngspice, klayout or PDK is installed or run here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install iverilog and cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "cocotb>=2.0,<3"

      - name: Run the shift-redundancy bench (expect 81/81)
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          python3 verification/run_tb.py

      - name: Negative control must exit exactly 1
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          rc=0
          python3 verification/run_tb.py --define INJECT_BUG_SHIFT_EDGE=1 || rc=$?
          if [ "$rc" != 1 ]; then
            echo "::error::negative control exited $rc, expected exactly 1"; exit 1
          fi

      - name: Run the datapath bench at N = 20 and N = 8 (expect 8/8 each)
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          python3 verification/run_tb.py --bench datapath --param N=20
          python3 verification/run_tb.py --bench datapath --param N=8

      - name: Latency negative control must exit exactly 1
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          rc=0
          python3 verification/run_tb.py --bench datapath --define INJECT_EXTRA_STAGE=1 || rc=$?
          if [ "$rc" != 1 ]; then
            echo "::error::latency negative control exited $rc, expected exactly 1"; exit 1
          fi

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the checkers
        run: python3 -I scripts/ci/test_checkers.py

      - name: Check evidence structure and sim/ record format
        run: python3 -I scripts/ci/check_evidence_format.py

      - name: Check the committed netlist is fresh against the RTL and the attestation chain
        run: python3 -I scripts/ci/check_design_sources.py

      - name: Check sim/ records are append-only
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 -I scripts/ci/check_sim_append_only.py --base "$BASE"

      - name: Install pinned grader
        run: pipx install "klayout-tools==$(cat signoff/KLT_VERSION)"

      - name: Re-grade the manifest and require the committed record to reproduce
        run: |
          set -u
          fresh="$(mktemp)"
          rc=0
          klt signoff --manifest signoff/block-manifest.json --format json > "$fresh" || rc=$?
          # 0 = every row met, 3 = rows unmet (today's honest state); anything else is a grader failure.
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3)"; exit 1
          fi
          if ! cmp -s "$fresh" signoff/block-manifest.signoff.json; then
            echo "::error::signoff/block-manifest.signoff.json does not reproduce; regenerate it (signoff/README.md)"
            diff -u signoff/block-manifest.signoff.json "$fresh" || true
            exit 1
          fi
          # Self-test: a one-byte edit of the record must be detected.
          tampered="$(mktemp)"
          sed 's/"unmet"/"met"/' signoff/block-manifest.signoff.json > "$tampered"
          if cmp -s "$fresh" "$tampered"; then
            echo "::error::re-grade self-test failed: tampered record still matches"; exit 1
          fi

      - name: Re-attest item 9 against the committed envelopes
        run: |
          # cold_start is local_only (needs the PDK, ngspice, Icarus): skipped here, file hashes still checked.
          for p in analog digital; do
            klt signoff --attest 9 --inventory "signoff/attest/item9-$p.inventory.json" \
              --check "signoff/attest/item9-$p.json" --format json > /dev/null
          done

      - name: Re-attest item 10 against the committed envelope
        run: |
          # The inventoried checkers run for real here (PDK-free); the envelope must reproduce.
          klt signoff --attest 10 --inventory signoff/attest/item10.inventory.json \
            --check signoff/attest/item10.json --format json > /dev/null
